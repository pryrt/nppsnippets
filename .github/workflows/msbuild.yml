name: MSBuild

on: [ push, pull_request ]

jobs:

  build_windows:
    runs-on: windows-2022
    strategy:
      max-parallel: 3
      matrix:
        build_configuration: [ Release ]
        build_platform: [ x64, Win32, ARM64 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2  
        with:
          vs-version: '[17.0,18.0)'  # Restricts discovery to MSBuild 17.x / VS 2022

      - name: Show MSBuild version
        run: msbuild -version

      - name: Clean up Legacy RC Syntax
        shell: powershell
        run: |
          $rcFile = "nppsnippets/NppSnippets_res.rc"
          if (Test-Path $rcFile) {
              # Dynamically replace a broken macro definition on line 32 with a hardcoded valid syntax fallback
              (Get-Content $rcFile) -replace 'FILEVERSION.*', 'FILEVERSION 1,7,1,1' -replace 'PRODUCTVERSION.*', 'PRODUCTVERSION 1,7,1,1' | Set-Content $rcFile
              Write-Host "Successfully patched legacy RC syntax for modern compiler compatibility."
          }

      - name: Run MSBuild
        run: msbuild NppSnippets.vcxproj /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}"

      - name: Archive artifacts for x64
        if: matrix.build_platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: nppsnippets_dll_x64
          path: ${{ matrix.build_platform }}/${{ matrix.build_configuration }}/NppSnippets.dll

      - name: Archive artifacts for x32
        if: matrix.build_platform == 'Win32'
        uses: actions/upload-artifact@v6
        with:
          name: nppsnippets_dll_x32
          path: ${{ matrix.build_platform }}/${{ matrix.build_configuration }}/NppSnippets.dll

      - name: Archive artifacts for ARM64
        if: matrix.build_platform == 'ARM64'
        uses: actions/upload-artifact@v6
        with:
          name: nppsnippets_dll_arm64
          path: ${{ matrix.build_platform }}/${{ matrix.build_configuration }}/NppSnippets.dll
